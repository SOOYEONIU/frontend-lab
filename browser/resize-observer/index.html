<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vanilla-ts template</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <div id="controls">
          <button>Increase Width</button>
          <button>Increase Height</button>
          <button id="toggle-overflow">Toggle Overflow Content</button>
          <button id="toggle-parent-width">Toggle Parent Width</button>
          <button id="toggle-hidden-box">Toggle Hidden Box Display</button>
          <button id="toggle-visibility-box">Toggle Visibility Box</button>
      </div>
      <div id="container">
          <div id="box"><span id="box-content">Observer Box</span></div>
      </div>

      <div id="parent">
          <div id="child">Child (width: 100%)</div>
      </div>

      <div id="hidden-box">Hidden Box (starts display:none)</div>

      <div id="visibility-box">Visibility Box (starts visible)</div>

      <pre id="log"></pre>
    </div>
  </body>
</html>
