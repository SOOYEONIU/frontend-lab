<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>intersection-observer lab</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <div id="controls">
        <button id="scroll-to-target">Scroll to Target</button>
        <button id="scroll-to-top">Scroll to Top</button>
        <button id="smooth-scroll-to-target">Smooth Scroll to Target</button>
        <button id="scroll-page-to-viewport-target">
          Scroll Page to Viewport Target
        </button>
        <button id="scroll-page-to-top">Scroll Page to Top</button>
        <button id="toggle-display-target">Toggle Display Target</button>
        <button id="unobserve-target">Unobserve Target (default observer)</button>
      </div>

      <!-- Case 06: target이 display:none이 되면 어떻게 되는가? -->
      <div id="display-target">Display Target (starts visible)</div>

      <div id="scroll-container">
        <div class="spacer"></div>
        <div id="target">Target</div>
        <div class="spacer"></div>
      </div>

      <pre id="log"></pre>

      <!-- Case 04: root를 지정하지 않으면(viewport 기준) 어떻게 동작하는가? -->
      <div id="page-spacer"></div>
      <div id="viewport-target">Viewport Target (root: viewport)</div>
      <div id="page-spacer"></div>
    </div>
  </body>
</html>
